name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Assemble from upstream
        run: ./build/assemble.sh

      # NoWarn=CA1707: upstream's own state at this tag, see DIVERGENCE.md.
      - name: Build the patched server
        run: dotnet build upstream/Jellyfin.Server/Jellyfin.Server.csproj -c Release -p:NoWarn=CA1707

      - name: Smoke test (migrate pass + leader + replica on Postgres)
        run: ./tests/smoke.sh
