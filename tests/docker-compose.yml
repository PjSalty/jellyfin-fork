services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jellyfin
      POSTGRES_USER: jellyfin
      POSTGRES_PASSWORD: smoketest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyfin"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The PostgreSQL provider plugin comes from the sibling repo's public
  # release (checksummed): the fork consumes the exact artifact users get.
  # JELLYFIN_PGSQL_VERSION picks the release. JELLYFIN_PGSQL_LOCAL_DIR points
  # at a directory holding an already-published jellyfin-pgsql-<ver>.zip and
  # its SHA256SUMS, used instead of downloading (smoke a release before it is
  # published); it must contain a slash, since a bare name would mount the
  # empty named volume below instead of the host directory.
  plugin-fetch:
    image: alpine:3.22
    environment:
      VER: ${JELLYFIN_PGSQL_VERSION:-12.1-0-salty.1}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache curl unzip >/dev/null
        if [ -f /plugin-local/SHA256SUMS ]; then
          cd /plugin-local
          echo "using local plugin files for $$VER"
        else
          cd /tmp
          curl -fsSLO https://github.com/PjSalty/jellyfin-pgsql/releases/download/$$VER/jellyfin-pgsql-$$VER.zip
          curl -fsSLO https://github.com/PjSalty/jellyfin-pgsql/releases/download/$$VER/SHA256SUMS
        fi
        sha256sum -c SHA256SUMS
        mkdir -p /config/plugins/PostgreSQL
        unzip -oq jellyfin-pgsql-$$VER.zip -d /config/plugins/PostgreSQL
        echo "plugin staged"
    volumes:
      - config:/config
      - ${JELLYFIN_PGSQL_LOCAL_DIR:-plugin-local}:/plugin-local:ro

  # Single-writer migration/seed pass (the pattern the Kubernetes Job uses):
  # upstream's --mode MigrateSystem, proving replicas never need to migrate.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: jellyfin-fork-smoke:local
    command: ["--mode", "MigrateSystem"]
    depends_on:
      postgres:
        condition: service_healthy
      plugin-fetch:
        condition: service_completed_successfully
    environment: &pgenv
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: jellyfin
      POSTGRES_USER: jellyfin
      POSTGRES_PASSWORD: smoketest
    volumes:
      - config:/config
      - ./database.xml:/config/config/database.xml

  # Dispatch target for the rffmpeg shims. Keys are generated by smoke.sh
  # into .sshkeys/ before the stack comes up.
  transcode-worker:
    build:
      context: worker
    image: jellyfin-fork-worker-smoke:local
    volumes:
      - ./.sshkeys/ssh_host_ed25519_key:/etc/ssh/hostkeys/ssh_host_ed25519_key:ro
      - ./.sshkeys/id_ed25519.pub:/home/rffmpeg/.ssh/authorized_keys:ro

  jellyfin-leader:
    image: jellyfin-fork-smoke:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *pgenv
      JELLYFIN_ROLE: leader
      JELLYFIN_SKIP_MIGRATIONS: "true"
    volumes:
      - config:/config
      - ./database.xml:/config/config/database.xml
      - ./.sshkeys/id_ed25519:/etc/rffmpeg/ssh/id_ed25519:ro
      - ./.sshkeys/known_hosts:/etc/rffmpeg/ssh/known_hosts:ro
    ports:
      - "8096:8096"

  jellyfin-replica:
    image: jellyfin-fork-smoke:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *pgenv
      JELLYFIN_ROLE: replica
      JELLYFIN_SKIP_MIGRATIONS: "true"
    volumes:
      - config:/config
      - ./database.xml:/config/config/database.xml
    ports:
      - "8097:8096"

volumes:
  # Shared /config mirrors the production target: phase 3 moves config to a
  # shared RWX volume so wizard state, plugins, and metadata are one truth.
  config:
  # Empty unless JELLYFIN_PGSQL_LOCAL_DIR binds a host directory instead.
  plugin-local:
